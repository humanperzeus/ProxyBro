ntLoaded","when":"pre-push gate run"}],"apis":[],"secrets":[],"agent_notes":["This is a PUBLIC repo — CLAUDE.md and STACK.md (the private ops docs with live payment mode, worker deploy commands, secret NAMES) are gitignored on purpose. Never add payment/admin mechanics (endpoints, mode-flip vars, secret names) to THIS architecture.json — that belongs in the private proxybro-worker repo's own map. Extension itself ships with ZERO secrets (hard rule, enforced: grep the diff before any commit).","creem-worker.js in this repo is a REFERENCE copy only (unmodified since v1.19.0) — the actually-deployed license-validation worker (richer: D1 feedback, referral, rate-limit) lives in the separate PRIVATE proxybro-worker repo. Don't assume creem-worker.js is what's live.","Fail-closed invariant: proxy ON for a spoofing identity implies the reliable document_start user-script path is confirmed live (chrome.userScripts present) — background.js disconnects instead of falling back to a racy executeScript path that could leak the real fingerprint. Needs Chrome's per-extension 'Allow user scripts' toggle; without it, spoofing simply won't activate (by design, not a bug).","DNS-leak model (CLAUDE.md §9 resolution-model class): DoH is NOT proxy-tunneled — it hides DNS from the local network but still resolves from the REAL IP. True exit-country DNS only comes from an HTTP/SOCKS5 proxy scheme (the proxy resolves). DoH is force-enabled ONLY for SOCKS4 (which has no remote DNS at all — DoH beats a plaintext local-ISP leak there); for HTTP/HTTPS/SOCKS5 DoH stays OFF so Chrome hands DNS to the proxy. Forcing DoH globally would be the wrong lever (competes with the goal path) — see background.js:429-451.","popup.js has a real top-level-vs-`setupEventListeners` scope rule: a function called from BOTH initialize() and an event listener MUST be declared top-level, or it ReferenceErrors at runtime. Gate is `node --check popup.js` (syntax) PLUS harness.html driven through real state transitions   svg.addEventListener("mouseout",()=>apply());
  let dragN=null;
  svg.addEventListener("pointerdown",ev=>{const g=ev.target.closest(".node");if(!g)return;
    dragN=byId[g.dataset.id];dragN.fixed=true;svg.classList.add("dragging");svg.setPointerCapture(ev.pointerId);});
  svg.addEventListener("pointermove",ev=>{if(!dragN)return;const r=svg.getBoundingClientRect();
    const sc=Math.min(r.width/W,r.height/H),ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;
    dragN.x=(ev.clientX-r.left-ox)/sc;dragN.y=(ev.clientY-r.top-oy)/sc;place();});
  svg.addEventListener("pointerup",()=>{if(dragN){dragN.fixed=false;dragN=null;svg.classList.remove("dragging");}});
  svg.addEventListener("click",ev=>{const g=ev.target.closest(".node");
    if(g){sel=g.dataset.id;apply();spec.onClick&&spec.onClick(g.dataset.id);}
    else{sel=null;apply();spec.onEmpty&&spec.onEmpty();}});
  svg.addEventListener("dblclick",ev=>{const g=ev.target.closest(".node");if(g&&spec.onDbl)spec.onDbl(g.dataset.id);});
  return {select(id){sel=id;apply();},reset(){sel=null;apply();},setHidden(h){hidden=h;apply();}};
}

// =================== main graph: components ===================
document.getElementById("purpose").textContent=A.purpose||"";
const CENTERS={ui:[.30,.22],api:[.38,.50],core:[.58,.42],data:[.80,.38],automation:[.52,.76],external:[.82,.72]};
const comps=A.components||[];
const cById=Object.fromEntries(comps.map(c=>[c.id,c]));
const cdeg={}; const cedges=[];
for(const c of comps)for(const d of (c.depends_on||[]))if(cById[d])cedges.push({s:c.id,t:d,kind:"dep"});
for(const f of (A.dataflows||[]))if(cById[f.from]&&cById[f.to])cedges.push({s:f.from,t:f.to,kind:"flow"});
for(const e of cedges){cdeg[e.s]=(cdeg[e.s]||0)+1;cdeg[e.t]=(cdeg[e.t]||0)+1;}
document.getElementById("stats").textContent=comps.length+" nodes · "+cedges.length+" edges · updated "+(A.updated||"");
if(!comps.length){const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:.85rem;text-align:center;padding:2rem";
  d.innerHTML="architecture.json hat noch keine <code>components[]</code> —<br>Schema: ~/Dev/Apps/AIMIND/ARCH-STANDARD.md";
  document.body.appendChild(d);}

const mainG=Graph(document.getElementById("mainstage"),{
  nodes:comps.map(c=>({id:c.id,label:c.name,sub:c.layer,color:COLORS[c.layer]||"#888",
    r:9+Math.min(13,(cdeg[c.id]||0)*1.7),cluster:CENTERS[c.layer]||[.5,.5],hideKey:c.layer})),
  edges:cedges,
  onClick:openComp, onEmpty:()=>{sel=null;panel.classList.remove("open");},
  onDbl:id=>{ if((SYM[id]||[]).length) openDrill(id); },
});

const panel=document.getElementById("panel");let sel=null;
function routeRows(){return (A.apis||[]).map(r=>"<tr><td>"+esc(r.route)+"</td><td>"+esc(r.method)+"</td><td>"+esc(r.does)+"</td></tr>").join("");}
function openComp(id){
  sel=id;const n=cById[id];if(!n)return;
  const rdeps=comps.filter(o=>(o.depends_on||[]).includes(id)).map(o=>o.id);
  const flows=(A.dataflows||[]).filter(f=>f.from===id||f.to===id);
  const nsym=(SYM[id]||[]).length;
  panel.innerHTML='<button class="close">✕</button>'
    +'<h2>'+esc(n.name)+'</h2>'
    +'<span class="layerbadge" style="background:'+(COLORS[n.layer]||"#888")+'">'+esc(n.layer)+'</span>'
    +'<span class="path">'+esc(n.path)+'</span>'
    +'<p>'+esc(n.does)+'</p>'
    +(nsym?'<button class="drillbtn" data-drill="'+esc(id)+'">⌖ drill into '+nsym+' functions →</button>':'')
    +(n.tech?'<h3>tech</h3><p>'+esc(n.tech)+'</p>':'')
    +((n.depends_on||[]).length?'<h3>depends on</h3>'+n.depends_on.map(d=>'<button class="chip" data-go="'+esc(d)+'">'+esc((cById[d]||{}).name||d)+'</button>').join(''):'')
    +(rdeps.length?'<h3>used by</h3>'+rdeps.map(d=>'<button class="chip" data-go="'+esc(d)+'">'+esc(cById[d].name)+'</button>').join(''):'')
    +(flows.length?'<h3>data flows</h3>'+flows.map(f=>'<p>'+esc((cById[f.from]||{}).name||f.from)+' → '+esc((cById[f.to]||{}).name||f.to)+': '+esc(f.what)+' <span style="color:var(--dim)">('+esc(f.when)+')</span></p>').join(''):'')
    +(n.verify?'<h3>verify</h3><code>'+esc(n.verify)+'</code>':'')
    +(n.layer==="api"&&(A.apis||[]).length?'<h3>routes</h3><table>'+routeRows()+'</table>':'');
  panel.classList.add("open");mainG.select(id);
}
panel.addEventListener("click",ev=>{
  if(ev.target.classList.contains("close")){panel.classList.remove("open");sel=null;mainG.reset();}
  const go=ev.target.dataset.go;if(go){ if(drillOpen) return; openComp(go);}
  const dr=ev.target.dataset.drill;if(dr)openDrill(dr);
});

// =================== drilldown: functions of one component ===================
const drill=document.getElementById("drill");let drillOpen=false,drillG=null;
function openDrill(id){
  const syms=SYM[id]||[];if(!syms.length)return;
  const comp=cById[id];
  document.getElementById("drilltitle").textContent=comp.name+" · functions";
  document.getElementById("drillpath").textContent=comp.path;
  // fan-in = how many other functions call this one ("held by")
  const fanIn={}; for(const s of syms)for(const c of s.calls)fanIn[c]=(fanIn[c]||0)+1;
  const roots=new Set(syms.filter(s=>!fanIn[s.name]).map(s=>s.name)); // entry points, called by nobody here
  const nodes=syms.map((s,i)=>({
    id:s.name, label:s.name, sub:"L"+s.line+(fanIn[s.name]?" ·"+fanIn[s.name]+"←":""),
    color: roots.has(s.name)?"#f5a524":"#a78bfa",
    r:9+Math.min(18,(fanIn[s.name]||0)*3.4),
    cluster:[.5,.5], _s:s, // single center — repulsion spreads them into a centered blob
  }));
  const edges=[]; for(const s of syms)for(const c of s.calls)if(syms.some(o=>o.name===c))edges.push({s:s.name,t:c,kind:"call"});
  drillG=Graph(document.getElementById("drillstage"),{
    nodes,edges,directed:true,
    onClick:name=>openSym(id,name), onEmpty:()=>{},
  });
  drill.classList.add("open");drillOpen=true;panel.classList.remove("open");
}
function openSym(compId,name){
  const syms=SYM[compId]||[];const s=syms.find(x=>x.name===name);if(!s)return;
  const callers=syms.filter(x=>x.calls.includes(name)).map(x=>x.name);
  panel.innerHTML='<button class="close">✕</button>'
    +'<h2>'+esc(name)+'()</h2>'
    +'<span class="layerbadge" style="background:#a78bfa">function</span>'
    +'<span class="path">'+esc(s.file)+':'+s.line+'</span>'
    +(s.calls.length?'<h3>calls</h3>'+s.calls.map(c=>'<button class="chip" data-sym="'+esc(c)+'">'+esc(c)+'()</button>').join(''):'<p style="color:var(--dim)">calls no local function (leaf / only external)</p>')
    +(callers.length?'<h3>held by · called from</h3>'+callers.map(c=>'<button class="chip" data-sym="'+esc(c)+'">'+esc(c)+'()</button>').join(''):'<p style="color:var(--dim)">not called locally — entry point</p>');
  panel.classList.add("open");panel.dataset.comp=compId;drillG&&drillG.select(name);
}
panel.addEventListener("click",ev=>{const sy=ev.target.dataset.sym;if(sy&&panel.dataset.comp)openSym(panel.dataset.comp,sy);});
document.getElementById("backbtn").addEventListener("click",()=>{
  drill.classList.remove("open");drillOpen=false;panel.classList.remove("open");delete panel.dataset.comp;
});

// =================== agent panel ===================
document.getElementById("agentbtn").addEventListener("click",()=>{
  mainG.reset();
  panel.innerHTML='<button class="close">✕</button>'
    +'<h2>⚠ for the next agent</h2>'
    +'<span class="layerbadge" style="background:var(--accent)">read me first</span>'
    +'<h3>notes</h3>'+(A.agent_notes||[]).map(x=>'<p>· '+esc(x)+'</p>').join('')
    +'<h3>conventions</h3>'+(A.conventions||[]).map(x=>'<p>· '+esc(x)+'</p>').join('')
    +'<h3>secrets (names only)</h3><table>'+(A.secrets||[]).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.used_for)+'<br><span style="color:var(--dim)">'+esc(s.location)+'</span></td></tr>').join('')+'</table>'
    +'<h3>entry points</h3><table>'+(A.entrypoints||[]).map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.how)+(e.verify?'<br><span style="color:var(--dim)">verify: '+esc(e.verify)+'</span>':'')+'</td></tr>').join('')+'</table>'
    +'<h3>stack</h3>'+(A.stack||[]).map(s=>'<button class="chip">'+esc(s)+'</button>').join('');
  panel.classList.add("open");delete panel.dataset.comp;
});

// =================== legend (main graph only) ===================
const lg=document.getElementById("legend");let hiddenLayers=new Set();
for(const l of LAYERS){
  if(!comps.some(n=>n.layer===l))continue;
  const b=document.createElement("div");b.className="lg";
  b.innerHTML='<span class="dot" style="background:'+COLORS[l]+'"></span>'+l+' <span style="opacity:.5">'+comps.filter(n=>n.layer===l).length+'</span>';
  b.addEventListener("click",()=>{hiddenLayers.has(l)?hiddenLayers.delete(l):hiddenLayers.add(l);b.classList.toggle("off");mainG.setHidden(new Set(hiddenLayers));});
  lg.appendChild(b);
}
</script>
</body>
</html>
